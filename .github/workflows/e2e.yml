name: Playwright E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ${{ github.repository == 'antiwork/helper' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192
      PNPM_STORE_PATH: ~/.pnpm-store

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Cache Supabase Docker images
        id: cache-supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('supabase/config.ci.toml') }}

      - name: Load Supabase images from cache
        if: steps.cache-supabase-images.outputs.cache-hit == 'true'
        run: |
          echo "Loading Supabase Docker images from cache..."
          docker load -i /tmp/supabase-images.tar

      - name: Pull and save Supabase images
        if: steps.cache-supabase-images.outputs.cache-hit != 'true'
        run: |
          echo "Starting Supabase to determine required images..."
          pnpm supabase start &
          
          echo "Waiting for Supabase services to be available..."
          for i in {1..10}; do
            STATUS_JSON=$(pnpm supabase status -o json || echo "failed")
            if [[ "$STATUS_JSON" != "failed" && $(echo "$STATUS_JSON" | jq 'length') -gt 0 ]]; then
              echo "Supabase status is available."
              break
            fi
            echo "Attempt $i: Supabase not ready yet, waiting 5 seconds..."
            sleep 5
          done

          IMAGES=$(pnpm supabase status -o json | jq -r '.[].image')
          if [ -z "$IMAGES" ]; then
            echo "::error::Could not determine Supabase Docker images. Aborting."
            exit 1
          fi

          echo "Required images:"
          echo "$IMAGES"

          echo "Pulling images..."
          echo "$IMAGES" | xargs -n 1 docker pull

          echo "Stopping Supabase..."
          pnpm supabase stop --no-backup

          echo "Saving images to cache..."
          docker save $(echo "$IMAGES") -o /tmp/supabase-images.tar

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Setup E2E test environment
        run: ./scripts/setup-e2e-tests.sh

      - name: Build next
        run: pnpm with-test-env next build

      - name: Run full Playwright suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
