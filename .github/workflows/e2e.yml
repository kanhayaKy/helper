name: Playwright E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ${{ github.repository == 'antiwork/helper' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192
      PNPM_STORE_PATH: ~/.pnpm-store
      # Define Supabase images to be cached
      SUPABASE_IMAGES: |
        supabase/postgres:15.1.0.110
        supabase/gotrue:v2.131.0
        supabase/realtime:v2.28.2
        supabase/storage-api:v0.48.2
        kong:3.6.1
        postgrest/postgrest:v11.2.2
        supabase/studio:20240705
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Supabase Docker images
        id: cache-supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('.github/workflows/e2e.yml') }}

      - name: Load Supabase images from cache
        if: steps.cache-supabase-images.outputs.cache-hit == 'true'
        run: |
          echo "Loading Supabase Docker images from cache..."
          docker load -i /tmp/supabase-images.tar

      - name: Pull and save Supabase images
        if: steps.cache-supabase-images.outputs.cache-hit != 'true'
        run: |
          echo "Pulling and saving Supabase Docker images..."
          echo "${{ env.SUPABASE_IMAGES }}" | xargs -n 1 docker pull
          docker save $(echo "${{ env.SUPABASE_IMAGES }}") -o /tmp/supabase-images.tar

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Setup E2E test environment
        run: ./scripts/setup-e2e-tests.sh

      - name: Build next
        run: pnpm with-test-env next build

      - name: Run full Playwright suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
