name: Playwright E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ${{ github.repository == 'antiwork/helper' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192
      PNPM_STORE_PATH: ~/.pnpm-store

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Supabase Docker images
        id: cache-supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('supabase/config.ci.toml', 'scripts/setup-e2e-tests.sh') }}
      
      - name: Load cached Supabase images
        if: steps.cache-supabase-images.outputs.cache-hit == 'true'
        run: |
          echo "📥 Loading Supabase Docker images from cache..."
          for tar_file in /tmp/supabase-images/*.tar; do
            echo "Loading: $(basename "$tar_file")"
            docker load -i "$tar_file"
          done
          echo "✅ Successfully loaded cached Docker images"
      
      - name: Extract required Supabase images
        if: steps.cache-supabase-images.outputs.cache-hit != 'true'
        run: |
          echo "🔍 Determining required Supabase Docker images..."
          
          # Ensure the cache directory exists
          mkdir -p /tmp/supabase-images
          
          # For CI, we use a specific configuration file
          export SUPABASE_CONFIG_PATH="./supabase/config.ci.toml"
          
          # Extract the image names from the config file - easier than starting Supabase
          POSTGRES_IMAGE=$(grep -o 'image = "supabase/postgres:[^"]*"' supabase/config.ci.toml | sed 's/image = "//;s/"//' || echo "supabase/postgres:15.1.0.110")
          
          # Add the standard Supabase services that are always used
          STANDARD_IMAGES=(
            "$POSTGRES_IMAGE"
            "supabase/gotrue:v2.131.0"
            "supabase/realtime:v2.28.2"
            "supabase/storage-api:v0.48.2"
            "kong:3.6.1"
            "postgrest/postgrest:v11.2.2"
            "supabase/studio:latest"
          )
          
          echo "📋 Required images:"
          for image in "${STANDARD_IMAGES[@]}"; do
            echo "  - $image"
          done
          
          echo "⬇️ Pulling and saving Supabase images individually..."
          for image in "${STANDARD_IMAGES[@]}"; do
            echo "Pulling: $image"
            docker pull "$image"
            
            # Save each image separately to avoid the 10GB cache size limit
            image_name=$(echo "$image" | sed 's/\//-/g' | sed 's/:/-/g')
            echo "Saving: $image as /tmp/supabase-images/${image_name}.tar"
            docker save "$image" -o "/tmp/supabase-images/${image_name}.tar"
          done
          
          echo "✅ Successfully saved all Docker images to cache"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Setup E2E test environment
        run: ./scripts/setup-e2e-tests.sh

      - name: Build next
        run: pnpm with-test-env next build

      - name: Run full Playwright suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
